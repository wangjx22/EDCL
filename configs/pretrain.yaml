seed: 42
device: cpu

data:
  # Path to a validated .pt file containing list[dict(z, pos, y)]. See
  # docs/data.md. With the default beta=10 energy loss, y is required. If
  # null, falls back to the synthetic dataset for an end-to-end smoke test.
  path: null
  num_synthetic_samples: 512
  batch_size: 32
  num_workers: 0

model:
  num_elements: 119
  hidden_dim: 128
  num_layers: 4          # paper uses 20 Equiformer-V2 blocks (Table 9); reduced, see README Deviations
  cutoff: 5.0
  max_neighbors: 32      # paper uses 50 (Table 9); reduced for CPU-friendly smoke tests
  omega: 0.1
  r_min: 0.8
  tau: 0.1
  dropout: 0.2           # paper Table 2
  drop_path_max: 0.1     # stochastic depth rate at last layer; paper reports 0.05/0.1, linearly scaled from 0 across layers

weights:
  alpha: 0.1     # contrastive
  beta: 10.0     # energy
  lam: 1.0       # KL

train:
  epochs: 100
  lr: 3.0e-4
  weight_decay: 1.0e-6
  grad_clip: 5.0
  log_every: 50
  ckpt_dir: checkpoints/pretrain
  ckpt_every_epoch: 10
  warmup_epochs: 5       # linear LR warmup (paper Table 2), then cosine decay
  min_lr_ratio: 0.01     # cosine decay floor as a fraction of peak lr
  ema_decay: 0.999       # EMA of encoder weights (paper Table 2); set 0 to disable
