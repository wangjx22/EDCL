seed: 42
device: cpu

data:
  # --- Paper-faithful mode (recommended): point these at the 3 files
  # produced by `scripts/make_scaffold_split.py` (scaffold split, no
  # re-shuffling). When both train_path and val_path are set, this mode
  # is used and `path`/`val_fraction` below are ignored. If test_path is
  # also set, a final held-out test evaluation is run and written to
  # <train.ckpt_dir>/test_metrics.json. See docs/data.md.
  train_path: null
  val_path: null
  test_path: null

  # --- Legacy/smoke mode: single file (or null -> synthetic data) with an
  # internal *random* train/val split. No test-set evaluation is produced
  # in this mode. Used only when train_path/val_path above are not set.
  path: null              # validated .pt list[dict(z,pos,y)]; see docs/data.md
  num_synthetic_samples: 256
  batch_size: 32
  val_fraction: 0.1

pretrained_ckpt: checkpoints/pretrain/last.pt   # from train_pretrain.py
use_ema: true            # use EMA-averaged encoder weights from the pretrain checkpoint if present

model:
  num_targets: 1
  hidden: 128
  task_type: regression   # "regression" (MSE+MAE/RMSE) or "binary_classification" (masked BCE+ROC-AUC)

train:
  epochs: 50
  lr: 1.0e-4
  weight_decay: 1.0e-6
  grad_clip: 5.0
  log_every: 20
  ckpt_dir: checkpoints/finetune
  warmup_epochs: 2
  min_lr_ratio: 0.01
