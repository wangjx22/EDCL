[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edcl"
version = "0.1.0"
description = "Dependency-light Equivariant Denoising Contrastive Learning"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.0",
  "numpy>=1.22",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
edcl-predict = "edcl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
